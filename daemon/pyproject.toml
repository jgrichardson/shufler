[project]
name = "shufler-daemon"
version = "0.1.0"
description = "A 3D control room for developers who run many AI coding agent sessions at once."
readme = "../README.md"
license = "MIT"
license-files = ["../LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "tomlkit>=0.15.2",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/jgrichardson/shufler"
Repository = "https://github.com/jgrichardson/shufler"
Issues = "https://github.com/jgrichardson/shufler/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
